name: Java CI with Gradle

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Checkout LimboAPI dependency
        uses: actions/checkout@v4.2.2
        with:
          repository: dancebunny98/LimboAPI
          ref: master
          path: limboapi
      - name: Set up JDK
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: 25
      - name: Publish LimboAPI API locally
        working-directory: limboapi
        run: ./gradlew :api:publishToMavenLocal
      - name: Build LimboFilter
        run: ./gradlew build -PvelocityLocalJar=limboapi/velocity-4.3.1-45.jar
      - name: Upload LimboFilter
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LimboFilter
          path: "build/libs/limbofilter*.jar"
      - name: Find correct JAR
        id: find-jar
        run: |
          output="$(find build/libs/ ! -name "*-javadoc.jar" ! -name "*-sources.jar" -type f -printf "%f\n")"
          echo "jarname=$output" >> "$GITHUB_OUTPUT"
      - name: Upload to the GitHub release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/libs/${{ steps.find-jar.outputs.jarname }}
          asset_name: ${{ steps.find-jar.outputs.jarname }}
          asset_content_type: application/java-archive
      - name: Upload to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        uses: RubixDev/modrinth-upload@v1.0.0
        with:
          token: ${{ env.MODRINTH_TOKEN }}
          file_path: build/libs/${{ steps.find-jar.outputs.jarname }}
          name: Release ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          relations: TZOteSf2:required
          game_versions: 1.7.2
          release_type: release
          loaders: velocity
          featured: true
          project_id: 6zIy0zBK
